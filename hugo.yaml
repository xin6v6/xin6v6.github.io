baseURL: "https://xin6v6.github.io/"
title: "Xin's Blog"
pagination:
  pagerSize: 10
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Xin's Blog"
  description: "个人博客"
  author: xin6v6
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Hi, I'm Xin 👋"
    Content: >
      欢迎来到我的博客，这里记录我的技术探索和生活感悟。

  socialIcons:
    - name: github
      url: "https://github.com/xin6v6"

menu:
  main:
    - identifier: ai
      name: AI
      url: /ai/
      weight: 10
    - identifier: typescript
      name: TypeScript
      url: /typescript/
      weight: 20
    - identifier: rust
      name: Rust
      url: /rust/
      weight: 30
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON
